<body class="sub" data-page="book">
<div id="site-nav"></div>
<main>
<section class="pagehead"><div class="container"><span class="eyebrow">Free Consultation</span><h1>Book a <span class="gradtext">free 30-min call</span></h1><p>Pick a time, tell me about your project, and I’ll come prepared.</p></div></section><section class="section"><div class="container book"><div class="cbox"><h3>Choose a date</h3>
    <div class="cal__head"><button type="button" id="prev" aria-label="Previous month">‹</button><b id="mname"></b><button type="button" id="next" aria-label="Next month">›</button></div>
    <div class="cal__grid" id="cal"></div><h3>Choose a time</h3><div class="slots" id="slots"></div></div>
    <div class="cbox" id="bwrap"><h3>Your details</h3><form class="bform" id="bform" novalidate>
      <div class="sel" id="sel"></div>
      <input name="name" placeholder="Your name" aria-label="Name" required><input name="email" type="email" placeholder="Email address" aria-label="Email" required>
      <input name="phone" placeholder="Phone / WhatsApp (optional)" aria-label="Phone">
      <textarea name="msg" id="bmsg" rows="4" placeholder="Tell me about your project…" aria-label="Project"></textarea>
      <button class="btn btn--primary" type="submit">Confirm booking</button><p class="note" id="bnote" role="status"></p></form></div></div></section>
</main>
<div id="site-footer"></div>
<script src="data.js"></script><script src="common.js"></script><script src="pages.js"></script>
